name: Checks

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e . pytest pytest-asyncio ruff
      - run: ruff check --select E9,F821,F822,F823 backend tg_signer tg_signer_contracts tests
      - run: python -m pytest -q
      - name: Resource efficiency HTTP E2E
        run: python tests/e2e/resource_efficiency.py --output /tmp/resource-e2e
      - name: Resource convergence HTTP and WebSocket E2E
        run: python tests/e2e/resource_convergence.py --output /tmp/resource-e2e/convergence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resource-e2e-python-${{ matrix.python }}
          path: /tmp/resource-e2e
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
